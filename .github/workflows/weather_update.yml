name: India Weather Update

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"

  # Allows you to manually run the workflow
  workflow_dispatch:

jobs:

  update-weather:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. Download repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. Create Google credentials file
      # ------------------------------------------------------
      - name: Create Google credentials
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
        run: |
          echo "$GOOGLE_CREDENTIALS_BASE64" | base64 --decode > google_credentials.json

      # ------------------------------------------------------
      # 5. Run weather updater
      # ------------------------------------------------------
      - name: Update weather data
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python weather_updater.py

      # ------------------------------------------------------
      # 6. Delete credentials
      # ------------------------------------------------------
      - name: Remove credentials
        if: always()
        run: |
          rm -f google_credentials.json
