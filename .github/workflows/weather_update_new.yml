name: India Weather Update

on:
  # Run automatically every 15 minutes
  schedule:
    - cron: "7,22,37,52 * * * *"

  # Allows you to run it manually from GitHub Actions
  workflow_dispatch:

  # Also runs whenever you push changes to main
  push:
    branches:
      - main

jobs:
  update-weather:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get files from your GitHub repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install Python packages
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Create Google credentials file
      # --------------------------------------------------
      - name: Create Google credentials
        env:
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_BASE64" ]; then
            echo "ERROR: GOOGLE_CREDENTIALS_BASE64 secret is missing."
            exit 1
          fi

          echo "$GOOGLE_CREDENTIALS_BASE64" | base64 --decode > google_credentials.json

          if [ ! -s google_credentials.json ]; then
            echo "ERROR: Google credentials file was not created."
            exit 1
          fi

          echo "Google credentials created successfully."

      # --------------------------------------------------
      # 5. Check Google Sheet ID
      # --------------------------------------------------
      - name: Check Google Sheet ID
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "ERROR: GOOGLE_SHEET_ID secret is missing."
            exit 1
          fi

          echo "Google Sheet ID is configured."

      # --------------------------------------------------
      # 6. Check Excel file
      # --------------------------------------------------
      - name: Check project files
        run: |
          echo "Checking project files..."

          if [ ! -f "indian_cities.xlsx" ]; then
            echo "ERROR: indian_cities.xlsx not found."
            exit 1
          fi

          if [ ! -f "weather_updater.py" ]; then
            echo "ERROR: weather_updater.py not found."
            exit 1
          fi

          echo "Required files found."

      # --------------------------------------------------
      # 7. Run weather updater
      # --------------------------------------------------
      - name: Update weather data
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python weather_updater.py

      # --------------------------------------------------
      # 8. Remove credentials after execution
      # --------------------------------------------------
      - name: Remove Google credentials
        if: always()
        run: |
          rm -f google_credentials.json

          echo "Credentials removed."
